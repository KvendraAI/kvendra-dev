# CI for kvendra.dev (ISSUE-KVD-DEV-2C5055, STD-KVD-DEV-56B82C): every pull request builds the
# site from the committed offline KB dump (no network to the KB), runs the content linter and
# its fixtures, and checks every page at 375 and 1440 px (0 px overflow, 0 page errors).
# This job is the required check of the main ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.59.1

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # kb:fetch (offline dump) + kb:transform + lint:content + astro build
      - run: npm run build

      - run: npm run test:linter

      - name: Generated content is committed
        run: git diff --exit-code -- src/content/generated

      # Playwright is a CI-only tool here: installed without touching package-lock.json.
      - run: npm install --no-save @playwright/test@${{ env.PLAYWRIGHT_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
