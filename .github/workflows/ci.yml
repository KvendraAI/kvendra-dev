# CI for kvendra.dev (ISSUE-KVD-DEV-2C5055, STD-KVD-DEV-56B82C): every pull request builds the
# site from the committed offline KB dump (no network to the KB), runs the content linter and
# its fixtures, and checks every page at 375 and 1440 px (0 px overflow, 0 page errors).
# This job is the required check of the main ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.59.1

jobs:
  build-and-check:
    name: Build, lint and site checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # kb:fetch (offline dump) + kb:transform + lint:content + astro build
      - run: npm run build

      - run: npm run test:linter

      - name: Generated content is committed
        run: git diff --exit-code -- src/content/generated

      # Playwright is a CI-only tool here: installed without touching package-lock.json.
      - run: npm install --no-save @playwright/test@${{ env.PLAYWRIGHT_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
